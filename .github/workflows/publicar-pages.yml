name: Publicar sitio (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["data/**", "site/**", "scripts/**", "scraper/**", ".github/workflows/publicar-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el historial de cortes se arma desde el historial de git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convertir data/ en las API del sitio
        run: python scripts/data_to_site.py
      - name: Historial de cortes
        run: python scripts/build_history.py
      - name: Regenerar tablero regional
        run: python scripts/build_propuesta_b.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
