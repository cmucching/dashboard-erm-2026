name: Actualizar datos ONPE (ERM 2026)

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, minuto 7 (UTC)
  workflow_dispatch:
    inputs:
      modo:
        description: "incremental | full | smoke"
        default: "smoke"
        type: choice
        options: [smoke, incremental, full]

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pruebas offline
        run: python -m unittest discover -s tests -v

      - name: Instalar Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descargar datos de ONPE
        id: scrape
        env:
          MODO: ${{ github.event.inputs.modo || 'incremental' }}
        run: |
          case "$MODO" in
            full) FLAG="--full" ;;
            smoke) FLAG="--smoke" ;;
            *) FLAG="" ;;
          esac
          python scraper/onpe_scraper.py --out data $FLAG

      - name: Commit si hay cambios
        run: |
          git config user.name "dashboard-erm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: actualización ONPE $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Avisar a Netlify (opcional)
        if: ${{ env.NETLIFY_BUILD_HOOK != '' }}
        run: curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
